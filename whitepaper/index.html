<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read the AsceMarket whitepaper: standardized covers and portfolio-aware clearing for future states.">
  <title>AsceMarket Whitepaper</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: white; color: #1d1d1f; font-family: system-ui, sans-serif; }
    main { max-width: 700px; margin: 0 auto; padding: 72px 24px; }
    .brand { font-weight: 700; letter-spacing: -.04em; font-size: 22px; }
    .label { margin: 80px 0 16px; color: #6e6e73; letter-spacing: .15em; font-size: 12px; text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(38px, 7vw, 62px); letter-spacing: -.04em; line-height: 1.1; margin: 0 0 24px; }
    p { color: #61616a; line-height: 1.6; max-width: 530px; }
    .actions { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 32px; }
    a { display: inline-block; padding: 13px 20px; border: 1px solid #dfe2e8; border-radius: 7px; color: #1d1d1f; font-size: 14px; font-weight: 600; text-decoration: none; }
    a.primary { background: #1f5eff; border-color: #1f5eff; color: white; }
    a:focus-visible { outline: 3px solid #8b5cf6; outline-offset: 4px; }
    footer { margin-top: 84px; padding-top: 22px; border-top: 1px solid #e5e8ee; color: #6e6e73; font-size: 12px; }

</head>

  <main>
    <div class="brand">AsceMarket</div>

    <div class="actions">
